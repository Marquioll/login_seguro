<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Editar usuário')}"></head>
<body>
    <main>
        <h1>Editar usuário</h1>

        <form th:action="@{/admin/usuarios/{id}/editar(id=${usuarioId})}"
              th:object="${usuario}"
              method="post">

            <div th:if="${#fields.hasGlobalErrors()}" role="alert">
                <p th:each="erro : ${#fields.globalErrors()}"
                   th:text="${erro}">
                </p>
            </div>

            <div>
                <label for="nome">Nome</label>
                <input type="text"
                       id="nome"
                       th:field="*{nome}"
                       maxlength="100"
                       required>

                <p th:if="${#fields.hasErrors('nome')}"
                   th:errors="*{nome}">
                </p>
            </div>

            <div>
                <label for="email">E-mail</label>
                <input type="email"
                       id="email"
                       th:field="*{email}"
                       maxlength="254"
                       required>

                <p th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}">
                </p>
            </div>

            <div>
                <label for="role">Perfil</label>
                <select id="role" th:field="*{role}" required>
                    <option th:each="perfil : ${perfis}"
                            th:value="${perfil}"
                            th:text="${perfil}">
                    </option>
                </select>

                <p th:if="${#fields.hasErrors('role')}"
                   th:errors="*{role}">
                </p>
            </div>

            <button type="submit">Salvar</button>
        </form>

        <p>
            <a th:href="@{/admin/usuarios}">Voltar à listagem</a>
        </p>
    </main>
</body>

<header th:replace="~{fragments/header :: header}"></header>
<footer th:replace="~{fragments/footer :: footer}"></footer>

</html>
