<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Cadastro de usuário')}"></head>     
<body>
    <main>
        <h1>Cadastro de usuário</h1>

        <form th:action="@{/cadastro}"
              th:object="${usuario}"
              method="post">

            <div th:if="${#fields.hasGlobalErrors()}" role="alert">
                <p th:each="erro : ${#fields.globalErrors()}"
                   th:text="${erro}">
                </p>
            </div>

            <div>
                <label for="nome">Nome</label>
                <input type="text"
                       id="nome"
                       th:field="*{nome}"
                       maxlength="100"
                       autocomplete="name"
                       required>

                <p th:if="${#fields.hasErrors('nome')}"
                   th:errors="*{nome}">
                </p>
            </div>

            <div>
                <label for="email">E-mail</label>
                <input type="email"
                       id="email"
                       th:field="*{email}"
                       maxlength="254"
                       autocomplete="email"
                       required>

                <p th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}">
                </p>
            </div>

            <div>
                <label for="senha">Senha</label>
                <input type="password"
                       id="senha"
                       name="senha"
                       minlength="8"
                       autocomplete="new-password"
                       required>

                <p th:if="${#fields.hasErrors('senha')}"
                   th:errors="*{senha}">
                </p>
            </div>

            <div>
                <label for="confirmarSenha">Confirmar senha</label>
                <input type="password"
                       id="confirmarSenha"
                       name="confirmarSenha"
                       minlength="8"
                       autocomplete="new-password"
                       required>

                <p th:if="${#fields.hasErrors('confirmarSenha')}"
                   th:errors="*{confirmarSenha}">
                </p>
            </div>

            <button type="submit">Cadastrar</button>
        </form>

        <p>
            Já possui uma conta?
            <a th:href="@{/login}">Entrar</a>
        </p>
    </main>
</body>
<header th:replace="~{fragments/header :: header}"></header>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</html>
